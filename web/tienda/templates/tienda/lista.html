{% extends 'tienda/base.html' %}
{% block content %}
<a class="btn" href="{% url 'crear_orden' %}">+ Nueva orden</a>
<table>
    <tr><th>ID</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Acciones</th></tr>
    {% for o in ordenes %}
    <tr>
        <td>{{ o.id }}</td>
        <td>{{ o.cliente }}</td>
        <td>{{ o.fecha }}</td>
        <td>${{ o.total }}</td>
        <td>
            <a class="btn" href="{% url 'lista_detalles' o.id %}">Detalles</a>
            <a class="btn" href="{% url 'editar_orden' o.id %}">Editar</a>
            <a class="btn" href="{% url 'eliminar_orden' o.id %}">Eliminar</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="5">No hay órdenes</td></tr>
    {% endfor %}
</table>
{% endblock %}
