<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Grupo 1 | Tienda Virtual{% endblock %}</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #090b14;
            --surface: #111522;
            --surface-raised: #171c2b;
            --line: #292f43;
            --text: #edf2ff;
            --muted: #929bb3;
            --cyan: #54f6e5;
            --pink: #ff4fd8;
            --yellow: #f7ef6b;
            --danger: #ff7189;
            --radius: 16px;
        }

        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(ellipse at 12% 0%, rgb(84 246 229 / 10%), transparent 34rem),
                radial-gradient(ellipse at 94% 16%, rgb(255 79 216 / 9%), transparent 30rem),
                var(--bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.55;
        }

        a { color: inherit; }
        .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
        .site-header { border-bottom: 1px solid rgb(84 246 229 / 18%); background: rgb(9 11 20 / 78%); }
        .header-inner {
            min-height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .brand { display: flex; align-items: center; gap: 13px; text-decoration: none; }
        .brand-mark {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            color: var(--bg);
            background: var(--cyan);
            border-radius: 12px 4px 12px 4px;
            box-shadow: 0 0 24px rgb(84 246 229 / 28%);
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -1px;
        }
        .brand-copy { display: grid; line-height: 1.2; }
        .brand-copy strong { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
        .brand-copy span { margin-top: 5px; color: var(--muted); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
        .nav-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .nav-link:hover, .nav-link:focus-visible { color: var(--cyan); }
        main.shell { padding-top: 54px; padding-bottom: 72px; }
        .page-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 30px;
        }
        .eyebrow {
            margin: 0 0 9px;
            color: var(--cyan);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .2em;
            text-transform: uppercase;
        }
        h1, h2, p { margin-top: 0; }
        h1 { margin-bottom: 8px; font-size: clamp(30px, 5vw, 46px); line-height: 1.08; letter-spacing: -.04em; }
        h2 { margin-bottom: 8px; font-size: 21px; letter-spacing: -.02em; }
        .lede { max-width: 620px; margin-bottom: 0; color: var(--muted); }
        .panel, .metric-card, .form-card, .confirm-card {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: linear-gradient(145deg, rgb(23 28 43 / 94%), rgb(15 19 31 / 96%));
            box-shadow: 0 18px 50px rgb(0 0 0 / 18%);
        }
        .panel { overflow: hidden; }
        .panel-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 21px 24px;
            border-bottom: 1px solid var(--line);
        }
        .panel-heading p { margin: 0; color: var(--muted); font-size: 13px; }
        .panel-heading h2 { margin: 0; }
        .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
        .metric-card { padding: 18px 20px; }
        .metric-card span { display: block; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        .metric-card strong { display: block; margin-top: 5px; color: var(--cyan); font-size: 25px; line-height: 1.25; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px 20px; border-bottom: 1px solid rgb(41 47 67 / 75%); white-space: nowrap; }
        th { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        td { font-size: 14px; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: rgb(84 246 229 / 3%); }
        .id-cell { color: var(--cyan); font-weight: 800; }
        .money { color: var(--yellow); font-variant-numeric: tabular-nums; }
        .actions { display: flex; flex-wrap: wrap; gap: 6px; }
        .btn, button {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 13px;
            border: 1px solid #3b435b;
            border-radius: 9px;
            color: var(--text);
            background: #1b2030;
            font: inherit;
            font-size: 12px;
            font-weight: 750;
            text-decoration: none;
            cursor: pointer;
            transition: border-color .16s ease, color .16s ease, transform .16s ease, box-shadow .16s ease;
        }
        .btn:hover, button:hover { transform: translateY(-1px); border-color: var(--cyan); color: var(--cyan); }
        .btn-primary, button[type="submit"] {
            border-color: var(--cyan);
            color: #071311;
            background: var(--cyan);
            box-shadow: 0 0 22px rgb(84 246 229 / 12%);
        }
        .btn-primary:hover, button[type="submit"]:hover { color: #071311; background: #83fff2; box-shadow: 0 0 24px rgb(84 246 229 / 28%); }
        .btn-danger { border-color: rgb(255 113 137 / 40%); color: var(--danger); }
        .btn-danger:hover { border-color: var(--danger); color: #fff; background: rgb(255 113 137 / 14%); }
        button.btn-danger[type="submit"] { border-color: rgb(255 113 137 / 40%); color: var(--danger); background: transparent; box-shadow: none; }
        button.btn-danger[type="submit"]:hover { border-color: var(--danger); color: #fff; background: rgb(255 113 137 / 14%); }
        .empty-state { padding: 42px 20px; color: var(--muted); text-align: center; }
        .empty-state strong { display: block; margin-bottom: 5px; color: var(--text); font-size: 16px; }
        .form-card, .confirm-card { width: min(100%, 620px); padding: clamp(22px, 5vw, 36px); }
        .field { display: grid; gap: 8px; margin: 20px 0; }
        label { color: #d7dced; font-size: 13px; font-weight: 700; }
        input {
            width: 100%;
            min-height: 46px;
            padding: 10px 13px;
            border: 1px solid #353d55;
            border-radius: 9px;
            outline: 0;
            color: var(--text);
            background: #0c101b;
            font: inherit;
        }
        input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgb(84 246 229 / 12%); }
        .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
        .back-link { margin-top: 18px; }
        .msg { margin: 0 0 12px; padding: 12px 15px; border: 1px solid; border-radius: 10px; font-size: 13px; }
        .success { border-color: rgb(84 246 229 / 28%); color: var(--cyan); background: rgb(84 246 229 / 7%); }
        .error { border-color: rgb(255 113 137 / 32%); color: #ff9aab; background: rgb(255 113 137 / 8%); }
        .site-footer { padding: 23px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
        .footer-inner { display: flex; justify-content: space-between; gap: 12px; }
        .site-footer strong { color: var(--text); font-weight: 700; }
        @media (max-width: 720px) {
            .shell { width: min(100% - 28px, 1120px); }
            main.shell { padding-top: 36px; }
            .page-heading { align-items: flex-start; flex-direction: column; }
            .metrics { grid-template-columns: 1fr; gap: 9px; }
            .metric-card { padding: 14px 17px; }
            .panel-heading { align-items: flex-start; flex-direction: column; padding: 18px; }
            th, td { padding: 12px 14px; }
            .footer-inner { flex-direction: column; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="shell header-inner">
            <a class="brand" href="{% url 'lista_ordenes' %}">
                <span class="brand-mark" aria-hidden="true">G1</span>
                <span class="brand-copy">
                    <strong>Grupo 1</strong>
                    <span>Tienda Virtual</span>
                </span>
            </a>
            <a class="nav-link" href="{% url 'lista_ordenes' %}">Órdenes</a>
        </div>
    </header>
    <main class="shell">
        {% for m in messages %}
            <div class="msg {% if m.tags == 'error' %}error{% else %}success{% endif %}" role="status">{{ m }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="shell footer-inner">
            <span><strong>GRUPO 1</strong> · TIENDA VIRTUAL</span>
            <span>Creadores: Gustavo Siu · Astrid Castellanos</span>
        </div>
    </footer>
</body>
</html>
