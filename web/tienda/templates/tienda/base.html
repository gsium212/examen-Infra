<!DOCTYPE html>
<html>
<head>
    <title>Órdenes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 6px 12px; }
        .msg { padding: 8px; margin: 5px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .btn { padding: 4px 10px; text-decoration: none; border: 1px solid #333;
               border-radius: 4px; color: #333; margin: 2px; display: inline-block; }
    </style>
</head>
<body>
    <h1>Gestor de Órdenes</h1>
    {% for m in messages %}
        <div class="msg {% if m.tags == 'error' %}error{% else %}success{% endif %}">{{ m }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</body>
</html>
